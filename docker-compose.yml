services:
  postgres:
    image: postgres:15-alpine
    container_name: crisp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: crisp_enterprise
      POSTGRES_USER: crisp
      POSTGRES_PASSWORD: crisp_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crisp -d crisp_enterprise"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: crisp_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crisp_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://crisp:crisp_secure_password_2026@postgres:5432/crisp_enterprise
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=change_me_to_a_production_random_secret_key_in_vault
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - STORAGE_BACKEND=local
      - MAX_UPLOAD_SIZE_MB=50
      - WORKER_CONCURRENCY=4
    volumes:
      - backend_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ready"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crisp_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000

volumes:
  postgres_data:
  redis_data:
  backend_uploads:
