services:
  - type: web
    name: crisp-ai-backend
    env: python
    rootDir: backend
    plan: starter
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        value: sqlite:///./crisp_ai.db
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: STORAGE_BACKEND
        value: local
